# =============================================================================
# Terraform Validation Workflow
# Validates Terraform configuration on every push/PR affecting terraform/
# =============================================================================

name: "Terraform Validate"

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "terraform/**"
      - ".github/workflows/validate.yml"

  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/validate.yml"

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  TF_VERSION: "~1.7"
  TFLINT_VERSION: "v0.50.3"

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Terraform format check
  # ---------------------------------------------------------------------------
  fmt:
    name: "Format Check"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt check
        working-directory: terraform
        run: terraform fmt -check -recursive -diff

  # ---------------------------------------------------------------------------
  # Job 2: Static analysis (tflint + checkov) – runs in parallel with validate
  # ---------------------------------------------------------------------------
  lint:
    name: "Static Analysis"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run tflint
        uses: terraform-linters/tflint@v0.50.3
        with:
          working_directory: terraform
          args: "--init --recursive"

      - name: Run Checkov security scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform
          framework: terraform
          output_format: cli,sarif
          output_file_path: console,checkov-results.sarif
          skip_check: CKV_OCI_1,CKV_OCI_2
        continue-on-error: true

      - name: Upload Checkov SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov-results.sarif
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # Job 3: Terraform init + validate + plan
  # ---------------------------------------------------------------------------
  validate-and-plan:
    name: "Init, Validate & Plan"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [fmt]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: terraform
        env:
          TF_VAR_tenancy_ocid: ${{ secrets.TF_VAR_tenancy_ocid }}
          TF_VAR_user_ocid: ${{ secrets.TF_VAR_user_ocid }}
          TF_VAR_fingerprint: ${{ secrets.TF_VAR_fingerprint }}
          TF_VAR_private_key: ${{ secrets.TF_VAR_private_key }}
          TF_VAR_compartment_ocid: ${{ secrets.TF_VAR_compartment_ocid }}
          TF_VAR_region: ${{ secrets.TF_VAR_region }}
        run: |
          terraform init \
            -backend-config="address=oci://${TF_VAR_tenancy_ocid}/${TF_VAR_compartment_ocid}/terraform-state" \
            -backend-config="region=${TF_VAR_region}" \
            -input=false \
            -no-color

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate -no-color

      - name: Terraform Plan
        working-directory: terraform
        env:
          TF_VAR_tenancy_ocid: ${{ secrets.TF_VAR_tenancy_ocid }}
          TF_VAR_user_ocid: ${{ secrets.TF_VAR_user_ocid }}
          TF_VAR_fingerprint: ${{ secrets.TF_VAR_fingerprint }}
          TF_VAR_private_key: ${{ secrets.TF_VAR_private_key }}
          TF_VAR_compartment_ocid: ${{ secrets.TF_VAR_compartment_ocid }}
          TF_VAR_region: ${{ secrets.TF_VAR_region }}
          TF_VAR_ssh_public_key: ${{ secrets.TF_VAR_ssh_public_key }}
          TF_VAR_admin_password: ${{ secrets.TF_VAR_admin_password }}
        run: |
          terraform plan \
            -out=tfplan \
            -input=false \
            -no-color \
            -var="ssh_public_key=${TF_VAR_ssh_PUBLIC_KEY:-''}" \
            -var="admin_password=${TF_VAR_ADMIN_PASSWORD:-''}"

      - name: Upload Terraform Plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: terraform/tfplan
          retention-days: 7

      # Comment plan summary on pull requests
      - name: Comment PR with plan output
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const planOutput = fs.readFileSync('terraform/tfplan.txt', 'utf8').toString();
            const maxLen = 5000;
            const body = planOutput.length > maxLen
              ? planOutput.slice(0, maxLen) + '\n\n... (truncated, see full artifact)'
              : planOutput;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🏗️ Terraform Plan Results\n\n<details><summary>Click to expand</summary>\n\n\`\`\`hcl\n${body}\n\`\`\`\n\n</details>\n\n_Committed: ${new Date().toISOString()}_`
            });

  # ---------------------------------------------------------------------------
  # Job 4: Summary
  # ---------------------------------------------------------------------------
  summary:
    name: "Validation Summary"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [fmt, lint, validate-and-plan]
    steps:
      - name: Generate summary
        run: |
          echo "## ✅ Terraform Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Format Check | ${{ needs.fmt.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Static Analysis (tflint) | ${{ needs.lint.result == 'success' && '✅ Passed' || needs.lint.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Init / Validate / Plan | ${{ needs.validate-and-plan.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`  " >> $GITHUB_STEP_SUMMARY
          echo "**Ref:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
