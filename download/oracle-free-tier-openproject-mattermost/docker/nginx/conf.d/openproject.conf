# =============================================================================
# Nginx - OpenProject
# Server block para o OpenProject com TLS (Let's Encrypt)
# =============================================================================
# ATENÇÃO: Substitua openproject.exemplo.com pelo domínio real.
# É recomendável usar um script de deploy (deploy.sh) que faça
# a substituição via envsubst antes de iniciar o Nginx.
# =============================================================================

# --- Redirecionamento HTTP → HTTPS ---
server {
    listen 80;
    listen [::]:80;

    server_name openproject.exemplo.com;

    # Permitir desafio ACME do Let's Encrypt (Certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
        try_files $uri =404;
    }

    # Redirecionar todo o restante para HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Servidor HTTPS principal ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name openproject.exemplo.com;

    # ===========================================================================
    # Certificados SSL (Let's Encrypt)
    # ===========================================================================
    ssl_certificate /etc/letsencrypt/live/openproject.exemplo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openproject.exemplo.com/privkey.pem;

    # ===========================================================================
    # Hardening TLS - Configuração moderna (Mozilla Intermediate)
    # ===========================================================================
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Sessões TLS
    ssl_session_cache shared:SSL_openproject:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # DH Parameters (gerar com: openssl dhparam -out dhparam.pem 2048)
    # ssl_dhparam /etc/nginx/dhparam.pem;

    # ===========================================================================
    # Cabeçalhos de segurança
    # ===========================================================================
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'self'; base-uri 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Log
    access_log /var/log/nginx/openproject_access.log main;
    error_log /var/log/nginx/openproject_error.log warn;

    # Tamanho máximo para upload de arquivos (projetos podem ter anexos grandes)
    client_max_body_size 200M;

    # ===========================================================================
    # Proxy reverso para o OpenProject
    # ===========================================================================
    location / {
        # Bloquear user-agents suspeitos
        if ($blocked_ua) {
            return 403;
        }

        # Rate limiting para API
        # limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://openproject;
        proxy_http_version 1.1;

        # Headers padrão de proxy
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Suporte a WebSocket (necessário para notificações em tempo real)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts ajustados para operações longas (importação de projetos)
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
        send_timeout 300;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        # Desabilitar buffering para streaming
        proxy_request_buffering off;
    }

    # ===========================================================================
    # Health check (para monitoramento interno)
    # ===========================================================================
    location /nginx-health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Bloquear acesso a arquivos ocultos
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
