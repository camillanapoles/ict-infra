# =============================================================================
# Nginx - Servidor padrão (catch-all)
# =============================================================================
# Este bloco captura qualquer requisição para domínios não configurados.
# Retorna 444 para fechar a conexão silenciosamente, descartando requisições
# de scanners e bots que acessam pelo IP diretamente.
# =============================================================================

# --- Bloqueio HTTP para domínios desconhecidos ---
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    # Permitir apenas o desafio ACME (para certificados de novos domínios)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
        try_files $uri =404;
    }

    # Fechar conexão para qualquer outra requisição
    location / {
        return 444;
    }

    # Desabilitar logs para reduzir ruído
    access_log off;
    error_log off;
}

# --- Bloqueio HTTPS para domínios desconhecidos ---
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;

    server_name _;

    # Certificado auto-assinado para o default_server (necessário para SSL)
    # Este certificado será usado apenas quando alguém acessar pelo IP
    ssl_certificate /etc/nginx/ssl/dummy-cert.pem;
    ssl_certificate_key /etc/nginx/ssl/dummy-key.pem;

    # Fechar conexão silenciosamente
    location / {
        return 444;
    }

    # Desabilitar logs
    access_log off;
    error_log off;
}
