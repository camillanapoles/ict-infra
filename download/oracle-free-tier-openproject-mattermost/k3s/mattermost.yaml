# =============================================================================
# mattermost.yaml - Mattermost Team — Namespace: incubadora-mattermost
# =============================================================================
# Deployment do Mattermost Team Edition com:
# - ConfigMap para configuracoes nao-sensiveis
# - Secret para senhas e tokens
# - Service ClusterIP para acesso interno
# - IngressRoute (Traefik) para acesso externo via dominio
# - NetworkPolicy: egress to incubadora-infra (PostgreSQL:5432)
# - WebSocket support via Traefik middlewares
# - Resources: 2 GB RAM, 0.5 CPU limit
# - Health checks (liveness, readiness, startup)
#
# CROSS-NAMESPACE DEPENDENCIES:
#   PostgreSQL: postgresql.incubadora-infra.svc.cluster.local:5432
#
# NOTA: Mattermost possui suporte a ARM64 nativo (imagem multi-arch).
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: mattermost-config
  namespace: incubadora-mattermost
  labels:
    app.kubernetes.io/name: mattermost
    app.kubernetes.io/component: messaging
    app.kubernetes.io/part-of: incubadora
data:
  # ---------------------------------------------------------------------------
  # Configuracao principal do Mattermost (formato config.json equivalente)
  # ---------------------------------------------------------------------------
  MM_SERVICESETTINGS_SITEURL: "https://chat.seudominio.com"
  MM_SERVICESETTINGS_LISTENADDRESS: ":8065"
  MM_SERVICESETTINGS_ENABLESECURITYFIXALERT: "true"
  MM_SERVICESETTINGS_ENABLEDEVELOPER: "false"
  MM_SERVICESETTINGS_ENABLECOMMENTS: "true"
  MM_SERVICESETTINGS_ENABLECUSTOMUSERSTATUS: "true"
  MM_SERVICESETTINGS_ENABLEEMOJI: "true"
  MM_SERVICESETTINGS_ENABLEFILEATTACHMENTS: "true"
  MM_SERVICESETTINGS_ENABLEGIFS: "true"
  MM_SERVICESETTINGS_ENABLELINKPREVIEWS: "true"
  MM_SERVICESETTINGS_ENABLERICHTTEXT: "true"
  MM_SERVICESETTINGS_ENABLEUSERCREATION: "true"
  MM_SERVICESETTINGS_ENABLEINVITATIONS: "true"
  MM_SERVICESETTINGS_ENABLEOPENSERVER: "false"

  # ---------------------------------------------------------------------------
  # Configuracoes de banco de dados (CROSS-NAMESPACE)
  # ---------------------------------------------------------------------------
  MM_SQLSETTINGS_DRIVERNAME: "postgres"
  MM_SQLSETTINGS_DATASOURCE: ""  # Construido via env + Secret
  MM_SQLSETTINGS_DBHOST: "postgresql.incubadora-infra.svc.cluster.local"
  MM_SQLSETTINGS_DBPORT: "5432"
  MM_SQLSETTINGS_DBNAME: "mattermost"
  MM_SQLSETTINGS_DBUSERNAME: "mattermost"

  # ---------------------------------------------------------------------------
  # Configuracoes de email (SMTP)
  # ---------------------------------------------------------------------------
  MM_EMAILSETTINGS_ENABLESMTPAUTH: "true"
  MM_EMAILSETTINGS_SMTPHOST: "smtp.seudominio.com"
  MM_EMAILSETTINGS_SMTPPORT: "587"
  MM_EMAILSETTINGS_SMTPUSERNAME: "noreply@seudominio.com"
  MM_EMAILSETTINGS_CONNECTIONSECURITY: "STARTTLS"
  MM_EMAILSETTINGS_FEEDBACKNAME: "Mattermost"
  MM_EMAILSETTINGS_FEEDBACKEMAIL: "noreply@seudominio.com"
  MM_EMAILSETTINGS_REPLYTOADDRESS: "noreply@seudominio.com"

  # ---------------------------------------------------------------------------
  # Configuracoes de files
  # ---------------------------------------------------------------------------
  MM_FILESETTINGS_DRIVERNAME: "local"
  MM_FILESETTINGS_DIRECTORY: "/mattermost/data"
  MM_FILESETTINGS_ENABLEPUBLICLINKS: "true"
  MM_FILESETTINGS_MAXFILESIZE: "52428800"  # 50 MB

  # ---------------------------------------------------------------------------
  # Configuracoes de seguranca
  # ---------------------------------------------------------------------------
  MM_SECURITYSETTINGS_ENFORCETHREADS: "true"
  MM_SECURITYSETTINGS_ENABLEINSECUREOUTGOINGCONNECTIONS: "false"
  MM_LOGSETTINGS_ENABLECONSOLE: "true"
  MM_LOGSETTINGS_CONSOLELEVEL: "INFO"
  MM_LOGSETTINGS_ENABLEFILE: "true"
  MM_LOGSETTINGS_FILELEVEL: "INFO"
  MM_LOGSETTINGS_FILELOCATION: "/mattermost/logs/mattermost.log"

  # ---------------------------------------------------------------------------
  # Configuracoes de performance
  # ---------------------------------------------------------------------------
  MM_PLUGINSETTINGS_ENABLEUPLOADS: "true"
  MM_METRICSSETTINGS_ENABLE: "true"
  MM_METRICSSETTINGS_LISTENADDRESS: ":8067"
  MM_EXPERIMENTALSETTINGS_ENABLELINKPREVIEWS: "true"

---
apiVersion: v1
kind: Secret
metadata:
  name: mattermost-secret
  namespace: incubadora-mattermost
  labels:
    app.kubernetes.io/name: mattermost
    app.kubernetes.io/component: messaging
    app.kubernetes.io/part-of: incubadora
type: Opaque
stringData:
  # ---------------------------------------------------------------------------
  # IMPORTANTE: Altere estes valores antes do deploy!
  # ---------------------------------------------------------------------------
  # Senha do banco de dados (deve corresponder ao postgres-secret em incubadora-infra)
  MM_SQLSETTINGS_DATASOURCE: "postgres://mattermost:CHANGE_ME_MATTERMOST_DB_PASSWORD@postgresql.incubadora-infra.svc.cluster.local:5432/mattermost?sslmode=disable&connect_timeout=10"
  # Senha do SMTP
  MM_EMAILSETTINGS_SMTPPASSWORD: "CHANGE_ME_SMTP_PASSWORD"
  # Token JWT para WebSocket (gerar: openssl rand -base64 64)
  MM_SERVICESETTINGS_TLSKEYFILE__HASH: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mattermost
  namespace: incubadora-mattermost
  labels:
    app.kubernetes.io/name: mattermost
    app.kubernetes.io/component: messaging
    app.kubernetes.io/part-of: incubadora
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: mattermost
      app.kubernetes.io/component: messaging
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mattermost
        app.kubernetes.io/component: messaging
      annotations:
        checksum/config: ""
    spec:
      # Garantir que rode em ARM64
      nodeSelector:
        kubernetes.io/arch: arm64
      initContainers:
        # ----------------------------------------------------------------------
        # Container de inicializacao - Aguarda o PostgreSQL (CROSS-NAMESPACE)
        # ----------------------------------------------------------------------
        - name: wait-for-postgres
          image: postgres:17-bookworm
          command:
            - sh
            - -c
            - |
              echo "Aguardando PostgreSQL em postgresql.incubadora-infra.svc.cluster.local:5432..."
              until pg_isready -h postgresql.incubadora-infra.svc.cluster.local -p 5432 -U mattermost; do
                echo "PostgreSQL nao esta pronto. Aguardando 5s..."
                sleep 5
              done
              echo "PostgreSQL esta pronto! Iniciando Mattermost..."

        # ----------------------------------------------------------------------
        # Container de inicializacao - Aguarda o Memcached (CROSS-NAMESPACE)
        # ----------------------------------------------------------------------
        - name: wait-for-memcached
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Aguardando Memcached em memcached.incubadora-infra.svc.cluster.local:11211..."
              until nc -z memcached.incubadora-infra.svc.cluster.local 11211; do
                echo "Memcached nao esta pronto. Aguardando 3s..."
                sleep 3
              done
              echo "Memcached esta pronto!"

          resources:
            limits:
              cpu: 50m
              memory: 64Mi
      containers:
        - name: mattermost
          image: mattermost/mattermost-team-edition:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8065
              protocol: TCP
            - name: metrics
              containerPort: 8067
              protocol: TCP
          envFrom:
            - configMapRef:
                name: mattermost-config
            - secretRef:
                name: mattermost-secret
          env:
            # Garantir que o datasource use o valor do Secret
            - name: MM_SQLSETTINGS_DATASOURCE
              valueFrom:
                secretKeyRef:
                  name: mattermost-secret
                  key: MM_SQLSETTINGS_DATASOURCE
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "0.5"
              memory: 2Gi
          # Health checks
          livenessProbe:
            httpGet:
              path: /api/v4/config
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /api/v4/config
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/v4/config
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30  # Ate 150s para o Mattermost iniciar
          volumeMounts:
            - name: mattermost-data
              mountPath: /mattermost/data
            - name: mattermost-plugins
              mountPath: /mattermost/plugins
            - name: mattermost-client-plugins
              mountPath: /mattermost/client/plugins
            - name: mattermost-logs
              mountPath: /mattermost/logs
      volumes:
        - name: mattermost-data
          persistentVolumeClaim:
            claimName: mattermost-data
        - name: mattermost-plugins
          persistentVolumeClaim:
            claimName: mattermost-plugins
        - name: mattermost-client-plugins
          emptyDir: {}
        - name: mattermost-logs
          emptyDir:
            sizeLimit: 1Gi
---
# PVCs para dados do Mattermost
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mattermost-data
  namespace: incubadora-mattermost
  labels:
    app.kubernetes.io/name: mattermost
    app.kubernetes.io/component: messaging
    app.kubernetes.io/part-of: incubadora
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: local-path
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mattermost-plugins
  namespace: incubadora-mattermost
  labels:
    app.kubernetes.io/name: mattermost
    app.kubernetes.io/component: messaging
    app.kubernetes.io/part-of: incubadora
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: local-path
---
apiVersion: v1
kind: Service
metadata:
  name: mattermost
  namespace: incubadora-mattermost
  labels:
    app.kubernetes.io/name: mattermost
    app.kubernetes.io/component: messaging
    app.kubernetes.io/part-of: incubadora
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8065
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 8067
      targetPort: metrics
      protocol: TCP
  selector:
    app.kubernetes.io/name: mattermost
    app.kubernetes.io/component: messaging
---
# =============================================================================
# NetworkPolicy - Egress to infra namespace (PostgreSQL + Memcached)
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mattermost-egress-infra
  namespace: incubadora-mattermost
  labels:
    app.kubernetes.io/name: mattermost
    app.kubernetes.io/component: messaging
    app.kubernetes.io/part-of: incubadora
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mattermost
  policyTypes:
    - Egress
  egress:
    # PostgreSQL in incubadora-infra
    - to:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/component: infrastructure
          podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - protocol: TCP
          port: 5432
    # Memcached in incubadora-infra
    - to:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/component: infrastructure
          podSelector:
            matchLabels:
              app.kubernetes.io/name: memcached
      ports:
        - protocol: TCP
          port: 11211
---
# =============================================================================
# NetworkPolicy - Allow ingress from Traefik (Ingress Controller)
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mattermost-allow-ingress
  namespace: incubadora-mattermost
  labels:
    app.kubernetes.io/name: mattermost
    app.kubernetes.io/part-of: incubadora
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mattermost
  policyTypes:
    - Ingress
  ingress:
    # Allow from Traefik ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        - ipBlock:
            cidr: 10.42.0.0/16  # K3s pod network (fallback)
      ports:
        - protocol: TCP
          port: 8065
---
# =============================================================================
# IngressRoute Traefik - Roteamento para o Mattermost
# =============================================================================
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mattermost-http
  namespace: incubadora-mattermost
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`chat.seudominio.com`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik
      services:
        - name: mattermost
          port: http
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mattermost-https
  namespace: incubadora-mattermost
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`chat.seudominio.com`)
      kind: Rule
      middlewares:
        - name: mattermost-security-headers
        - name: mattermost-websocket
      services:
        - name: mattermost
          port: http
  tls:
    secretName: mattermost-tls
    domains:
      - main: "chat.seudominio.com"
---
# Middleware para headers de seguranca do Mattermost
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: mattermost-security-headers
  namespace: incubadora-mattermost
spec:
  headers:
    frameDeny: true
    contentTypeNosniff: true
    browserXssFilter: true
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    stsPreload: true
    referrerPolicy: "strict-origin-when-cross-origin"
---
# Middleware para manter WebSockets abertos (necessario para Mattermost)
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: mattermost-websocket
  namespace: incubadora-mattermost
spec:
  # Timeouts aumentados para WebSockets do Mattermost
  # Necessario para notificacoes em tempo real
  headers:
    customResponseHeaders:
      X-WebSocket-Allowed: "true"
