# =============================================================================
# Nginx - Mattermost
# Server block para o Mattermost com TLS (Let's Encrypt)
# =============================================================================
# ATENÇÃO: Substitua mattermost.exemplo.com pelo domínio real.
# É recomendável usar um script de deploy (deploy.sh) que faça
# a substituição via envsubst antes de iniciar o Nginx.
# =============================================================================

# --- Redirecionamento HTTP → HTTPS ---
server {
    listen 80;
    listen [::]:80;

    server_name mattermost.exemplo.com;

    # Permitir desafio ACME do Let's Encrypt (Certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
        try_files $uri =404;
    }

    # Redirecionar todo o restante para HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Servidor HTTPS principal ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name mattermost.exemplo.com;

    # ===========================================================================
    # Certificados SSL (Let's Encrypt)
    # ===========================================================================
    ssl_certificate /etc/letsencrypt/live/mattermost.exemplo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mattermost.exemplo.com/privkey.pem;

    # ===========================================================================
    # Hardening TLS - Configuração moderna (Mozilla Intermediate)
    # ===========================================================================
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Sessões TLS
    ssl_session_cache shared:SSL_mattermost:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # DH Parameters (gerar com: openssl dhparam -out dhparam.pem 2048)
    # ssl_dhparam /etc/nginx/dhparam.pem;

    # ===========================================================================
    # Cabeçalhos de segurança
    # ===========================================================================
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # CSP mais permissiva para Mattermost (permite inline scripts para Markdown)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src * data: blob:; font-src 'self' data:; connect-src *; frame-src 'self'" always;
    add_header Permissions-Policy "camera=(self \"https://mattermost.exemplo.com\") microphone=(self \"https://mattermost.exemplo.com\") geolocation=()" always;

    # Log
    access_log /var/log/nginx/mattermost_access.log main;
    error_log /var/log/nginx/mattermost_error.log warn;

    # Tamanho máximo para upload de arquivos
    client_max_body_size 100M;

    # ===========================================================================
    # Proxy reverso para o Mattermost
    # ===========================================================================
    location / {
        # Bloquear user-agents suspeitos
        if ($blocked_ua) {
            return 403;
        }

        proxy_pass http://mattermost;
        proxy_http_version 1.1;

        # Headers padrão de proxy
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # =========================================================================
        # WebSocket - Obrigatório para o Mattermost funcionar corretamente
        # =========================================================================
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # =========================================================================
        # Timeouts - Mattermost precisa de conexões longas para WebSocket
        # =========================================================================
        proxy_connect_timeout 90;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
        send_timeout 300;

        # Buffering
        proxy_buffering off;
        proxy_buffer_size 4k;
        proxy_buffers 4 4k;

        # Chunked transfer encoding (necessário para streaming do Mattermost)
        proxy_request_buffering off;
        proxy_http_version 1.1;

        # Rate limiting para prevenir abuso
        # limit_req zone=api_limit burst=50 nodelay;
    }

    # ===========================================================================
    # Headers específicos do Mattermost (recomendados pela documentação oficial)
    # ===========================================================================
    location ~ /api/v[0-9]+/(users/)?websocket$ {
        proxy_pass http://mattermost;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        send_timeout 86400s;
        proxy_buffering off;
    }

    # ===========================================================================
    # Health check (para monitoramento interno)
    # ===========================================================================
    location /nginx-health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Bloquear acesso a arquivos ocultos
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
