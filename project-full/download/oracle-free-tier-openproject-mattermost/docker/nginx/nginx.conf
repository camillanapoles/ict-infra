# =============================================================================
# Nginx - Configuração Principal
# Oracle Cloud Free Tier - OpenProject + Mattermost
# =============================================================================
# Este arquivo é a configuração global do Nginx. As configurações específicas
# de cada serviço (OpenProject, Mattermost) ficam em conf.d/*.conf
# =============================================================================

# Usuário que executa o Nginx (container Alpine = nobody)
user nginx;

# Processos worker - auto detecta baseado nos CPUs disponíveis
worker_processes auto;

# Arquivo de log de erros
error_log /var/log/nginx/error.log warn;

# PID do processo master
pid /var/run/nginx.pid;

# =============================================================================
# Eventos - Configuração de conexões
# =============================================================================
events {
    # Número máximo de conexões simultâneas por worker
    # 1024 é adequado para a VM A1 Free Tier
    worker_connections 1024;

    # Aceita múltiplas conexões por worker (melhor performance)
    multi_accept on;

    # Método de polling (epoll é mais eficiente no Linux)
    use epoll;
}

# =============================================================================
# HTTP - Configurações globais
# =============================================================================
http {
    # --- Tipos MIME ---
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # --- Formato de logs ---
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" '
                    'upstream=$upstream_addr '
                    'response_time=$upstream_response_time '
                    'request_time=$request_time';

    log_format combined_debug '$remote_addr - $remote_user [$time_local] "$request" '
                              '$status $body_bytes_sent "$http_referer" '
                              '"$http_user_agent" '
                              'upstream_addr=$upstream_addr '
                              'upstream_status=$upstream_status '
                              'upstream_response_time=$upstream_response_time '
                              'request_time=$request_time';

    access_log /var/log/nginx/access.log main;

    # --- Envio de arquivos ---
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # --- Compressão GZIP ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        font/opentype
        font/ttf
        font/woff
        font/woff2
        image/svg+xml
        multipart/form-data;

    # --- Upstream: OpenProject ---
    upstream openproject {
        server openproject:80;
        keepalive 32;
    }

    # --- Upstream: Mattermost ---
    upstream mattermost {
        server mattermost:8065;
        keepalive 32;
    }

    # --- Limites de requisição ---
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    client_max_body_size 200m;
    client_body_timeout 60s;
    client_header_timeout 60s;
    send_timeout 60s;

    # --- Rate limiting ---
    # Proteção básica contra abuso
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

    # --- Mapa para bloquear user-agents maliciosos ---
    map $http_user_agent $blocked_ua {
        default 0;
        "~*sqlmap" 1;
        "~*nikto" 1;
        "~*masscan" 1;
        "~*zgrab" 1;
        "~*dirbuster" 1;
    }

    # --- Incluir configurações de cada domínio ---
    include /etc/nginx/conf.d/*.conf;
}
