# =============================================================================
# scaffold.yaml — PROJECT SCAFFOLD & COMPLETE RESOURCE REFERENCE
# =============================================================================
# OpenProject 15 + Mattermost Team Edition
# K3s Single-Node | Oracle A1 Flex (4 OCPU / 24 GB RAM) | Ubuntu 22.04 ARM64
#
# This file is the DEFINITIVE project scaffold. It serves as:
#   1. A human-readable architecture reference
#   2. A deployment order guide
#   3. A cross-namespace dependency map
#   4. A resource budget tracker
#
# To deploy everything, use the Kustomize kustomization.yaml:
#   kubectl apply -k .
# Or deploy files in order (see DEPLOYMENT ORDER below).
#
# =============================================================================
# ARCHITECTURE OVERVIEW
# =============================================================================
#
# ┌─────────────────────────────────────────────────────────────────┐
# │  Oracle A1 Flex — 1 VM — 4 OCPU / 24 GB RAM — Ubuntu 22.04    │
# │                                                                 │
# │  K3s Single-Node Cluster (control-plane + worker in 1 VM)       │
# │                                                                 │
# │  ┌──────────────────────────────────────────────────────────┐   │
# │  │  Namespace: incubadora-infra                             │   │
# │  │  ├─ PostgreSQL 17  (4GB RAM, 1 CPU)  [shared]           │   │
# │  │  ├─ Memcached 1.6   (512MB RAM)       [shared]           │   │
# │  │  └─ NetworkPolicy: allow from openproject + mattermost   │   │
# │  ├──────────────────────────────────────────────────────────┤   │
# │  │  Namespace: incubadora-openproject                       │   │
# │  │  ├─ OpenProject 15  (3GB RAM, 1.5 CPU)                  │   │
# │  │  ├─ PVC: openproject-data (30Gi)                         │   │
# │  │  └─ NetworkPolicy: egress to infra:5432 + infra:11211   │   │
# │  ├──────────────────────────────────────────────────────────┤   │
# │  │  Namespace: incubadora-mattermost                        │   │
# │  │  ├─ Mattermost Team  (2GB RAM, 0.5 CPU)                  │   │
# │  │  ├─ PVC: mattermost-data (20Gi) + mattermost-plugins (2Gi)│  │
# │  │  └─ NetworkPolicy: egress to infra:5432 + infra:11211   │   │
# │  ├──────────────────────────────────────────────────────────┤   │
# │  │  Namespace: incubadora-backup                            │   │
# │  │  ├─ CronJob: daily pg_dump (02:00 UTC)                   │   │
# │  │  ├─ CronJob: weekly verify (Sunday 04:00 UTC)            │   │
# │  │  ├─ PVC: backup-data (20Gi)                              │   │
# │  │  └─ NetworkPolicy: egress to infra:5432                  │   │
# │  ├──────────────────────────────────────────────────────────┤   │
# │  │  Namespace: cert-manager  (system)                       │   │
# │  │  ├─ ClusterIssuers: letsencrypt-prod + letsencrypt-staging│  │
# │  │  └─ Certificates: openproject-tls + mattermost-tls       │   │
# │  ├──────────────────────────────────────────────────────────┤   │
# │  │  Namespace: traefik  (system)                            │   │
# │  │  ├─ Traefik v2 (Ingress Controller)                     │   │
# │  │  └─ ACME resolver via Cloudflare DNS-01                  │   │
# │  └──────────────────────────────────────────────────────────┘   │
# │                                                                 │
# │  RESOURCE BUDGET:                                               │
# │  ├─ Apps:    ~10.1 GB RAM / 3.0 CPU                            │
# │  ├─ K3s:     ~0.5 GB RAM / 0.3 CPU                             │
# │  ├─ OS+Docker: ~1.5 GB RAM / 0.5 CPU                           │
# │  └─ Free:    ~12 GB RAM / 0.7 CPU                               │
# └─────────────────────────────────────────────────────────────────┘
#
# =============================================================================
# DEPLOYMENT ORDER (strict — dependencies must exist first)
# =============================================================================
#
# STEP 1 — NAMESPACE FOUNDATION
#   $ kubectl apply -f namespaces.yaml
#   Creates: incubadora-infra, incubadora-openproject,
#            incubadora-mattermost, incubadora-backup
#
# STEP 2 — NETWORK POLICIES (security baseline before any workloads)
#   $ kubectl apply -f network-policies.yaml
#   Creates: default-deny rules + DNS allow rules in all namespaces
#
# STEP 3 — INFRASTRUCTURE (shared services in incubadora-infra)
#   $ kubectl apply -f postgresql.yaml
#   Creates: ConfigMap, Secret, PVC, StatefulSet, Service, NetworkPolicy
#   $ kubectl apply -f memcached.yaml
#   Creates: Deployment, Service, NetworkPolicy
#   WAIT: kubectl wait --for=condition=Ready pod/postgresql-0 -n incubadora-infra --timeout=180s
#         kubectl wait --for=condition=Available deployment/memcached -n incubadora-infra --timeout=120s
#
# STEP 4 — CERTIFICATES (before apps need TLS)
#   PREREQ: Cloudflare API token secret in cert-manager namespace
#   $ kubectl create secret generic cloudflare-api-token \
#       --from-literal=api-token=YOUR_TOKEN -n cert-manager
#   $ kubectl apply -f cert-manager.yaml
#   Creates: ClusterIssuers (prod+staging), Certificates (openproject+mattermost)
#
# STEP 5 — APPLICATIONS
#   $ kubectl apply -f openproject.yaml
#   Creates: ConfigMap, Secret, Deployment, PVC, Service, NetworkPolicies, IngressRoutes, Middlewares
#   $ kubectl apply -f mattermost.yaml
#   Creates: ConfigMap, Secret, Deployment, PVCs, Service, NetworkPolicies, IngressRoutes, Middlewares
#
# STEP 6 — BACKUP
#   $ kubectl apply -f backup-cronjob.yaml
#   Creates: PVC, ConfigMap, Secret, NetworkPolicy, CronJobs (daily+verify)
#
# =============================================================================
# CROSS-NAMESPACE SERVICE DEPENDENCIES
# =============================================================================
#
# incubadora-openproject → incubadora-infra:
#   PostgreSQL:  postgresql.incubadora-infra.svc.cluster.local:5432
#   Memcached:   memcached.incubadora-infra.svc.cluster.local:11211
#
# incubadora-mattermost → incubadora-infra:
#   PostgreSQL:  postgresql.incubadora-infra.svc.cluster.local:5432
#   Memcached:   memcached.incubadora-infra.svc.cluster.local:11211
#
# incubadora-backup → incubadora-infra:
#   PostgreSQL:  postgresql.incubadora-infra.svc.cluster.local:5432 (read-only pg_dump)
#
# traefik → incubadora-openproject:
#   HTTP: openproject.incubadora-openproject.svc.cluster.local:8080
#
# traefik → incubadora-mattermost:
#   HTTP: mattermost.incubadora-mattermost.svc.cluster.local:8065
#
# =============================================================================
# SECRETS REQUIRED (must be created before deployment)
# =============================================================================
#
# Namespace: incubadora-infra
#   postgres-secret:
#     POSTGRES_PASSWORD:       (superuser password)
#     OPENPROJECT_PASSWORD:    (openproject DB user password)
#     MATTERMOST_PASSWORD:     (mattermost DB user password)
#
# Namespace: incubadora-openproject
#   openproject-secret:
#     OPENPROJECT_SECRET_KEY_BASE:  (64-char random hex)
#     OPENPROJECT_DB__PASSWORD:     (must match OPENPROJECT_PASSWORD above)
#     OPENPROJECT_EMAIL__SMTP__PASSWORD:
#     OPENPROJECT_ADMIN__PASSWORD:
#     OPENPROJECT_ADMIN__EMAIL:
#
# Namespace: incubadora-mattermost
#   mattermost-secret:
#     MM_SQLSETTINGS_DATASOURCE:     (connection string, must match MATTERMOST_PASSWORD)
#     MM_EMAILSETTINGS_SMTPPASSWORD:
#
# Namespace: incubadora-backup
#   postgres-backup-secret:
#     POSTGRES_PASSWORD:  (must match superuser password in incubadora-infra)
#
# Namespace: cert-manager
#   cloudflare-api-token:
#     api-token:  (Cloudflare API Token with Zone:DNS:Edit)
#
# =============================================================================
