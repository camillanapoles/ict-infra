# =============================================================================
# PVC SUMMARY
# =============================================================================
#
# NOTE: On Oracle Free Tier, total block storage is limited to 200 GB.
# The 122 Gi allocated leaves ~78 Gi for OS, Docker images, and K3s.
# If you need more space, reduce postgres-data from 50Gi to 30Gi.
